
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Random NYC Day Planner</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <main class="planner">
      <p class="eyebrow">A DAY IN NEW YORK CITY</p>
      <h1>Where should we go today?</h1>
      <p class="intro">
        A randomly generated NYC day, from coffee to your last stop.
      </p>

      <section class="day-card">
        <p class="tag" id="day-type"></p>
        <h2 id="day-title"></h2>
        <p id="summary"></p>

        <ul id="stops"></ul>

        <div class="budget">
          <p id="cost-breakdown"></p>
          <p class="total" id="total-cost"></p>
          <p id="budget-message"></p>
        </div>

        <p class="tip" id="tip"></p>
      </section>

      <p class="footnote">Refresh the page for another day!</p>
    </main>
  </body>
</html>
